syntax = "proto3";
package Authentication;

import "Packets/AuthTypes.proto";

message AuthenticatePacket
{
    AuthTypes AuthType = 1;
    
    string SessionId = 2;
    
    string Username = 4;
    
    string Password = 5;

    // Which version of the network protocol the client speaks. Clients from before this existed send 0
    int32 ProtocolVersion = 6;
}