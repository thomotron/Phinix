syntax = "proto3";
package UserManagement;

import "Packets/LoginFailureReason.proto";

message LoginResponsePacket
{
    bool Success = 1;
    
    string Uuid = 2;

    string DisplayName = 3;
    
    LoginFailureReason FailureReason = 4;
    
    string FailureMessage = 5;

    // Features the server has switched off (see Features), so the mod can hide them. Empty from older servers, which
    // means everything is on
    repeated string DisabledFeatures = 6;
}