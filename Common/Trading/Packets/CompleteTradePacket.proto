syntax = "proto3";
package Trading;

import "Packets/Thing.proto";

message CompleteTradePacket
{
    string TradeId = 1;

    string OtherPartyUuid = 2;

    bool Success = 3;
    
    repeated ProtoThing Items = 4;
    bool Returned = 5;                      // Not a trade ending: things the other player's game couldn't use, sent back
};